version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: airspace-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-airspace}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-airspace}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - airspace-net

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: airspace-backend-prod
    restart: always
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_pass}@postgres:5432/${POSTGRES_DB:-airspace}
      - BACKEND_CORS_ORIGINS=["http://localhost:3000"]
      # Optional: Inject AI API keys here
      # - AIRSPACE_AI_API_KEY=${AIRSPACE_AI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - airspace-net

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000
        - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws/spatial
    container_name: airspace-frontend-prod
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - airspace-net

volumes:
  pgdata:
    driver: local

networks:
  airspace-net:
    driver: bridge
